# React Native's Podfile and Gradle plugin resolve paths by walking node_modules
# (`require.resolve("react-native/scripts/react_native_pods.rb")` and friends).
# Yarn 3 defaults to PnP, under which those lookups fail and neither `pod install`
# nor an Android build can run. RN has no PnP support, so pin the classic linker.
nodeLinker: node-modules
