# Fallbacks for consuming apps that don't define these in `rootProject.ext`.
# android/build.gradle reads `rootProject.ext.<name>` first and falls back to
# `HealthKits_<name>`; without these, that fallback resolves to null and
# `.toInteger()` throws during configuration.
#
# minSdk is 28 because androidx.health.connect:connect-client requires 26 and
# this library documents Android 9+ (API 28).
HealthKits_kotlinVersion=1.9.10
HealthKits_minSdkVersion=28
HealthKits_compileSdkVersion=35
HealthKits_targetSdkVersion=34
